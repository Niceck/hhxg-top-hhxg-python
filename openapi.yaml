openapi: "3.1.0"

info:
  title: 恢恢量化 A股数据接口
  description: |
    恢恢量化 A股量化数据 API，提供日报快照、融资融券、财经快讯、A股日历等数据。

    **数据更新时间**：每个交易日 20:22 起更新，预计 20:30 前完成（北京时间）；两融数据于交易日上午约 09:05 更新上一交易日数据

    **使用说明**：
    - 非交易日返回最近一个交易日的数据
    - `/api/snapshot`、`/api/margin`、`/api/news`、`/api/calendar` 为公开接口，无需鉴权
    - `/api/data/{scope}` 为付费接口：`Authorization: Bearer <token>`，token 在会员中心登录后于开发者接入页（developer.html）签发
      （Max 最多 5 个并可单个撤销；2026-10-27 前开通的 Pro 保留 1 个至原到期日；有效期至会员到期，续费后重签即延长）；`/api/data/index` 目录接口无需鉴权
    - MCP / 数据 API 为 Max（¥99 档）权益；限流按会员计：Max 300 req/min（多个 token 共享；存量 Pro 60 req/min），超限 429 并带 retry_after_seconds
    - 详细数据及可视化图表请访问 [https://hhxg.top](https://hhxg.top)；Max 接入说明见 /developer.html
  version: "1.3.0"
  x-pricing:
    currency: CNY
    source: https://hhxg.top/api/data/index
    plans:
      - plan: vip_month
        price: 20
        duration_days: 30
        api_access: false
        commercial_use: false
      - plan: vip_year
        price: 200
        duration_days: 365
        api_access: false
        commercial_use: false
      - plan: dev_month
        price: 99
        duration_days: 30
        data_api_per_min: 300
        commercial_use: true
      - plan: dev_year
        price: 999
        duration_days: 365
        data_api_per_min: 300
        commercial_use: true
  contact:
    name: 恢恢量化
    url: https://hhxg.top

servers:
  - url: https://hhxg.top
    description: 生产环境

paths:
  /api/snapshot:
    get:
      operationId: getSnapshot
      summary: 获取 A 股日报快照
      description: |
        返回最近交易日的 A 股量化全景数据，包含：
        - **市场情绪**（赚钱效应指数、涨停/炸板数量、昨日对比）
        - **连板天梯**（各板数量、晋级率、失败率及个股明细）
        - **游资龙虎榜**（买入/卖出榜单、席位净买明细）
        - **热门题材**（资金净流入、涨停数量、领涨个股）
        - **行业资金流向**（净流入额、涨跌幅、龙头股）
        - **宏观新闻**（最近 6 条重要财经新闻）

        数据每个交易日盘后更新，预计 20:30 前完成（北京时间）。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "502":
          description: 数据源暂时不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服务异常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-openai-isConsequential: false

  /api/margin:
    get:
      operationId: getMargin
      summary: 获取近 7 日融资融券数据
      description: |
        返回近 7 个交易日的融资融券余额趋势，包含：
        - 融资余额（亿元）及日变化量
        - 融券余额（亿元）及日变化量
        - 两融合计余额及趋势

        数据每个交易日上午约 09:05 更新上一交易日的两融数据（北京时间）。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginResponse"
        "502":
          description: 数据源暂时不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-openai-isConsequential: false

  /api/news:
    get:
      operationId: getNews
      summary: 获取最新财经快讯
      description: |
        返回最新财经快讯列表，每小时滚动更新。
        包含宏观政策、上市公司公告、市场动态等。
      parameters:
        - name: limit
          in: query
          description: 返回条数，范围 1-50，默认 20
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsResponse"
        "502":
          description: 数据源暂时不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-openai-isConsequential: false

  /api/calendar:
    get:
      operationId: getCalendar
      summary: 获取 A 股日历
      description: |
        返回 A 股日历数据，支持以下类型：
        - **trading** — 全年交易日历（开市/休市日期）
        - **delivery** — 期权/期货交割日（全年）
        - **earnings** — 财报季披露日期（按月）
        - **unlock** — 限售股解禁日期（按月）
      parameters:
        - name: type
          in: query
          description: "数据类型：trading / delivery / earnings / unlock，默认 trading"
          required: false
          schema:
            type: string
            enum:
              - trading
              - delivery
              - earnings
              - unlock
            default: trading
        - name: month
          in: query
          description: "月份，格式 YYYY-MM（earnings/unlock 时需要），默认当月"
          required: false
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
            example: "2026-03"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarResponse"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 该月份数据暂未生成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: 数据源暂时不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-openai-isConsequential: false

  /api/data/index:
    get:
      operationId: getDataApiIndex
      summary: 数据 API 目录（无需鉴权）
      description: |
        返回全部付费 scope 列表、月度归档 scope、限流口径与机器可读套餐目录 `plans`
        （价格 / 时长 / 限流 / token 数 / 是否含商用许可 / 购买链接）。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataApiIndexResponse"
      x-openai-isConsequential: false

  /api/data/{scope}:
    get:
      operationId: getDataApiScope
      summary: 按 scope 拉取站内数据（付费，Bearer token）
      description: |
        统一信封 `{ success, scope, description, fetched_at, data }`。scope 一览：
        - `snapshot`：日报快照：赚钱效应/题材/连板天梯/游资/行业/焦点新闻聚合
        - `hotmoney`：近 7 日游资龙虎榜席位明细
        - `news`：近 7 日财经快讯（含 AI 利好/利空分类，支持 ?sentiment=利好|利空|中性|未分类 过滤）
        - `dongmi`：近 30 日董秘问答全量（?month=YYYYMM 取月度归档 CSV）
        - `theme-concepts`：题材概念成分股映射（每交易日更新）
        - `margin`：近 7 日融资融券余额与净买入（?month=YYYYMM 取月度归档 CSV）
        - `sentiment`：近 7 日市场情绪指标
        - `strategy`：最新量化策略选股结果
        - `themes-ranking`：最新题材热度排名
        - `northbound`：近 7 日北向资金流向
        - `breadth`：近 7 日大盘宽度（涨跌家数/涨停/跌停/赚钱效应）时序
        - `funds`：近 7 日行业/板块资金流（主力净流入/流出排名）
        - `etf`：ETF 全景榜：规模 / 成交额 / 涨幅 / 行业 ETF 排名（?month=YYYYMM 取日线月度归档 CSV）
        - `chipwork`：筹码工程：筹码集中度排名、获利盘比例高/低、行业筹码概览
        - `stock-indicators`：个股技术指标榜：MACD/KDJ/RSI 等多维度排序与共振信号
        - `concept-chain`：题材概念链：每日热点概念的链式传导路径 + 龙头/分歧/补涨股映射
        - `indicator-resonance`：多指标共振信号：MA / MACD / RSI / 量能多周期同向信号股
        - `risk-alerts`：风险警报：暴跌 / 出货 / 九转见顶 / 高换手下跌 4 类预警
        - `resonance`：跨 KB 共振信号：技术 / 资金 / 题材 / 情绪同时确认的标的
        - `strategy-full`：策略历史全统计：胜率 / 月度分布 / TOP winners&losers（多策略对比）
        - `community-sentiment`：社区情绪：雪球 / 微博 / 东财股吧综合多空打分 + 热议帖子摘要
        - `moneyflow`：个股资金流月度归档：无参返回可用月份索引，?month=YYYYMM 取当月 CSV
        - `blocktrade`：大宗交易月度归档：无参返回可用月份索引，?month=YYYYMM 取当月 CSV

        带 `history` 的 scope（`dongmi` / `margin` / `etf` / `moneyflow` / `blocktrade`）支持 `?month=YYYYMM` 取当月归档 CSV 直链信封
        `{ success, scope, month, type: "csv_url", url, hint }`，CSV 体积可达数 MB，调用方自行拉取。
        `news` 支持 `?sentiment=利好|利空|中性|未分类`（亦接受 bull / bear / neutral）。
      security:
        - bearerToken: []
      parameters:
        - name: scope
          in: path
          required: true
          schema:
            type: string
            enum:
              - snapshot
              - hotmoney
              - news
              - dongmi
              - theme-concepts
              - margin
              - sentiment
              - strategy
              - themes-ranking
              - northbound
              - breadth
              - funds
              - etf
              - chipwork
              - stock-indicators
              - concept-chain
              - indicator-resonance
              - risk-alerts
              - resonance
              - strategy-full
              - community-sentiment
              - moneyflow
              - blocktrade
        - name: month
          in: query
          required: false
          description: "月度归档（仅 history scope）：YYYYMM"
          schema:
            type: string
            pattern: "^\\d{6}$"
            example: "202605"
        - name: sentiment
          in: query
          required: false
          description: "仅 news：利好 / 利空 / 中性 / 未分类（或 bull / bear / neutral）"
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataApiEnvelope"
        "400":
          description: 参数错误（month / sentiment 取值无效）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: 未带 token / token 无效或已撤销 / 会员不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: 会员已过期或被封禁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: scope 不存在（响应含 available_scopes）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: 超过档位限流（按会员计），响应含 retry_after_seconds
          headers:
            Retry-After:
              schema:
                type: integer
              description: 建议等待秒数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: 上游静态数据暂不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: 限流基建故障（KV 不可用，fail-closed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      x-openai-isConsequential: false

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 由 /api/vip-data-api-token 签发的数据 API token（payload.type = data_api）
  schemas:
    DataApiIndexResponse:
      type: object
      properties:
        success:
          type: boolean
        service:
          type: string
        auth:
          type: string
        rate_limit:
          type: string
        plans:
          type: array
          description: 机器可读套餐目录（真源 pricing.js）
          items:
            type: object
            properties:
              plan:
                type: string
              tier:
                type: string
                enum: [vip, developer]
              name:
                type: string
              price_cny:
                type: number
              duration_days:
                type: integer
              auto_renew:
                type: boolean
              data_api_per_min:
                type: integer
              max_tokens:
                type: integer
              token_lifetime:
                type: string
                enum: [membership]
                description: token 到期 = 签发时的会员到期（不按档位设天数；续费后重签即延长）
              commercial_use:
                type: boolean
              buy_url:
                type: string
        history_scopes:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: object
            properties:
              scope:
                type: string
              endpoint:
                type: string
              description:
                type: string
              history:
                type: string
                description: 支持月度归档的 scope 才有：GET /api/data/<scope>?month=YYYYMM
    DataApiEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        scope:
          type: string
        description:
          type: string
        fetched_at:
          type: string
          format: date-time
        data:
          description: 该 scope 的 JSON 数据（结构因 scope 而异，见 /static/data/schemas/）
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: RATE_LIMIT_EXCEEDED
        message:
          type: string
        error:
          type: string
        detail:
          type: string
          nullable: true
        trace_id:
          type: string
        retry_after_seconds:
          type: integer
          description: 仅 429
    SnapshotResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: 日报快照数据
          properties:
            date:
              type: string
              description: 数据日期，格式 YYYY-MM-DD
              example: "2026-03-01"
            market:
              type: object
              description: 市场情绪数据（赚钱效应指数、涨停炸板数量）
            hot_themes:
              type: array
              description: 热门题材列表（游资净流入、涨停数量）
            sectors:
              type: array
              description: 行业资金流向列表（净流入、涨跌幅、龙头股）
            ladder:
              type: object
              description: 连板天梯摘要（各板数量）
            ladder_detail:
              type: object
              description: 连板天梯明细（晋级率、个股名称、行业）
            hotmoney:
              type: array
              description: 游资龙虎榜（席位名称、净买额、个股明细）
            macro_news:
              type: array
              description: 宏观财经新闻列表（最近 6 条）
            comparison:
              type: object
              description: 昨日数据对比（市场情绪、涨停等）
            ai_summary:
              type: string
              description: AI 生成的市场简评

    MarginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: 近 7 日融资融券数据
          properties:
            days:
              type: array
              description: 按日期排列的融资融券记录
              items:
                type: object
                properties:
                  date:
                    type: string
                    description: 日期
                  margin_long:
                    type: number
                    description: 融资余额（亿元）
                  margin_short:
                    type: number
                    description: 融券余额（亿元）
                  total:
                    type: number
                    description: 两融合计（亿元）

    NewsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            items:
              type: array
              description: 财经快讯列表
              items:
                type: object
                properties:
                  title:
                    type: string
                    description: 新闻标题
                  time:
                    type: string
                    description: 发布时间
                  category:
                    type: string
                    description: 新闻分类
            total:
              type: integer
              description: 总条数

    CalendarResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        type:
          type: string
          description: 数据类型
        month:
          type: string
          description: 月份（earnings/unlock 有效）
        data:
          type: object
          description: 日历数据（结构因 type 而异）

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: 错误信息
          example: "数据源暂时不可用，请稍后重试"
